services:
  - type: web
    name: enterprise-dashboard-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-dashboard-db
          property: connectionString

databases:
  - name: enterprise-dashboard-db
    plan: free
